<!doctype html>
<html lang="en">
  <head>
    <script>
      let savedTheme = null;
      let systemDark = false;
      try {
        savedTheme = localStorage.getItem("heritageverse-theme");
      } catch { /* The system preference remains available when storage is blocked. */ }
      try { systemDark = Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch { /* Use the light default when preferences are unavailable. */ }
      document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemDark ? "dark" : "light";
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HeritageVerse — Monuments in Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
